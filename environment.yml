name: laser-lock
channels:
  - defaults
dependencies:
  # Python >= 3.10 required for structural pattern matching syntax compatibility.
  # time.perf_counter_ns() needs >= 3.7.
  - python=3.12
  # All other imports (ctypes, threading, collections, csv, argparse, math, random)
  # are Python standard library — no third-party packages required for the monitor.
  # The plotting notebook additionally requires:
  - numpy
  - pandas
  - matplotlib
  - scipy
  - ipykernel
  - pip
  - pip:
    # Toptica SDK for DLC Pro control via USB serial (lock.py).
    # v2.7.2 firmware support requires SDK >= 3.1.0.
    - toptica-lasersdk>=3.1.0
